name: Deploy to Hetzner

on:
  push:
    branches:
      - main
  # A push to main once landed without Actions creating a run for it, leaving
  # the site a commit behind with nothing to click. This makes a redeploy
  # possible from the Actions tab without an empty commit.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Declared here because a step's `if:` cannot read the secrets context -
    # a workflow that tries is rejected before any job starts, which shows up
    # as a run that failed instantly with no jobs and no log. Through env it
    # is readable.
    env:
      BING_API_KEY: ${{ secrets.BING_API_KEY }}

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Usage Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: 🛠 Build Project
        run: npm run build

      # SCP only ever copies. Anything deleted from the build stayed on the
      # server for good - a removed page kept answering 200 and stale Next.js
      # chunks piled up from every past build. rsync mirrors instead.
      #
      # --exclude keeps api/config.php, which holds the mail credentials and
      # exists only on the server.
      # --max-delete aborts instead of wiping the site if the build ever comes
      # out near-empty or the target path is wrong.
      - name: 🚀 Deploy via rsync
        env:
          SSH_HOST: ${{ secrets.SFTP_HOST }}
          SSH_USER: ${{ secrets.SFTP_USERNAME }}
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          REMOTE_TARGET: ${{ secrets.REMOTE_TARGET }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync sshpass
          sshpass -e rsync -az --delete --delete-after --max-delete=1500 \
            --exclude '/api/config.php' \
            -e "ssh -p 22 -o StrictHostKeyChecking=no" \
            dist/ "$SSH_USER@$SSH_HOST:$REMOTE_TARGET/"

      # Announcing the deploy to the engines that accept being told. Google is
      # not among them - it takes a sitemap and nothing else - so these two
      # cover Bing, Yandex, Seznam and Naver.
      #
      # They run after rsync, never before: announcing a page that is not on
      # the server yet earns a crawl of the old version.
      #
      # continue-on-error, because by this point the site is already live. An
      # outage at someone else's API must not repaint a finished deploy as a
      # failure - the step still shows red on its own, which is the signal
      # worth having.
      - name: 🔔 Submit to IndexNow
        continue-on-error: true
        run: node submit_to_indexnow.js

      # Skipped until the secret exists, rather than failing on every deploy.
      # The key this script was written against answers InvalidApiKey, so a new
      # one has to be generated in Bing Webmaster Tools (Settings -> API access)
      # and stored as BING_API_KEY before this step does anything.
      - name: 🔍 Submit to Bing Webmaster API
        if: ${{ env.BING_API_KEY != '' }}
        continue-on-error: true
        run: node submit_to_bing.js
